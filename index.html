<style>
html,body{margin:0;height:100%;background:#141414;overflow:hidden;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#e8e8e8}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#hjalp{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));padding:14px 16px;border-radius:14px;background:#1b1b1b;border:1px solid #3a3a3a;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:2}

<body>
<iframe id="app" title="Ekonomi Savidden" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="hjalp" hidden role="status"><button type="button" onclick="this.parentNode.hidden=true" aria-label="Stäng">×</button>
<b>Kommer sidan inte upp?</b>Första gången vill Google fråga om behörighet, och vissa webbläsare (Safari) tillåter inte Google-inloggning i en ram. Öppna sidan direkt en gång, godkänn och kom sedan tillbaka hit.<br>
<a id="direkt" target="_top" rel="noopener">Öppna Ekonomi Savidden direkt</a></div>
<script>
/* Ekonomi Savidden – ram utan Googles varningsrad. Skapad av Ekonomi → Startsida utan Google-varning i kalkylarket. */
var EXEC = "https://script.google.com/macros/s/AKfycbypf7PFTiU8CJvVdDUE-ZrRmjd012-YDWsg5UDwdDii16Y2hHgJrXQ7F3M9qnW6uwSJ/exec";
var url = EXEC + (location.search || "");
document.getElementById("app").src = url;
document.getElementById("direkt").href = url;
var klar = false;
window.addEventListener("message", function (m) { if (m && m.data && m.data.ekoKlar) { klar = true; document.getElementById("hjalp").hidden = true; } });
setTimeout(function () { if (!klar) document.getElementById("hjalp").hidden = false; }, 15000);
</script>
